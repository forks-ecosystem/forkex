paths:
  /orderbook:
    x-swagger-router-controller: public
    get:
      description: Returns the top orderbooks
      operationId: getTopOrderbook
      tags:
        - Public
      parameters:
        - name: symbol
          in: query
          description: Currency symbol
          required: false
          type: string
          maxLength: 256
      responses:
        200:
          description: Success
          schema:
            $ref: "#/definitions/OrderbooksResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/MessageResponse"
  /orderbook/{symbol}:
    x-swagger-router-controller: public
    get:
      description: Returns orderbook for specific pair
      operationId: getTopOrderbook
      tags:
        - Public
      parameters:
        - name: symbol
          in: path
          description: Currency symbol
          required: true
          type: string
          maxLength: 256
      responses:
        200:
          description: Success
          schema:
            $ref: "#/definitions/OrderbooksResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/MessageResponse"
  /orderbooks:
    x-swagger-router-controller: public
    get:
      description: Returns the top orderbooks
      operationId: getTopOrderbooks
      tags:
        - Public
      responses:
        200:
          description: Success
          schema:
            $ref: "#/definitions/OrderbooksResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/MessageResponse"
