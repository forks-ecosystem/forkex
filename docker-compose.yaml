name: forkex
services:
  # ─── Database ──────────────────────────────────────────────
  postgres:
    container_name: forkex-db
    image: postgres:14.9-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - /srv/forkex/postgresql:/var/lib/postgresql/data
    networks:
      - forkex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    container_name: forkex-redis
    image: redis:8.0.2-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD}"]
    volumes:
      - /srv/forkex/redis:/data
    networks:
      - forkex-network

  # ─── Backend ───────────────────────────────────────────────
  api:
    container_name: forkex-api
    image: forkex-api:v10
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=10010
      - WS_ENABLED=false
      - WS_URL=ws://websocket:10011/stream
      - NETWORK_URL=${NETWORK_URL}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 10010:10010
    networks:
      - forkex-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  plugins:
    container_name: forkex-plugins
    build:
      context: .
      dockerfile: plugins/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - 10012:10012
    networks:
      - forkex-network
    depends_on:
      - api

  websocket:
    container_name: forkex-ws
    build: ./ws
    restart: unless-stopped
    env_file: .env
    ports:
      - 10011:10011
    networks:
      - forkex-network
    depends_on:
      - redis

  affiliation:
    container_name: forkex-affiliation
    build:
      context: .
      dockerfile: affiliation/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - 10013:10013
    networks:
      - forkex-network

  # ─── Frontend ──────────────────────────────────────────────
  web:
    container_name: forkex-web
    image: forkex-web:v2
    build:
      context: ./web
      dockerfile: docker/Dockerfile
      args:
        - REACT_APP_DOMAIN=${DOMAIN}
    restart: always
    env_file: .env
    ports:
      - 8080:80
    networks:
      - forkex-network
    depends_on:
      - api

  # ─── Proxy ─────────────────────────────────────────────────
  nginx:
    container_name: forkex-nginx
    build: ./nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/static:/usr/share/nginx/html
      - ./nginx/letsencrypt:/etc/nginx/letsencrypt:ro
    ports:
      - "127.0.0.1:8888:80"
    networks:
      - forkex-network
    depends_on:
      - api
      - web
      - websocket

  # ─── Services ──────────────────────────────────────────────
  bot:
    container_name: forkex-bot
    build: ./bot
    restart: unless-stopped
    env_file: .env
    command: ./forkex-bot
    networks:
      - forkex-network
    depends_on:
      - api

  price-oracle:
    container_name: price-oracle
    build: ./price-oracle
    restart: unless-stopped
    env_file: .env
    command: ./price-oracle
    ports:
      - 8082:8082
    networks:
      - forkex-network
    depends_on:
      - postgres

networks:
  forkex-network:
    external: true
    name: forkex-network
