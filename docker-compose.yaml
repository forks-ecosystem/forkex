name: forkex
services:
  # ─── Database ──────────────────────────────────────────────
  postgres:
    container_name: forkex-db
    image: postgres:14.9-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - /opt/db/postgresql:/var/lib/postgresql/data
    ports:
      - 5456:5432
    networks:
      - forkex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    container_name: forkex-redis
    image: redis:8.0.2-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD}"]
    volumes:
      - /opt/db/redis:/data
    ports:
      - 6379:6379
    networks:
      - forkex-network

  # ─── Backend ───────────────────────────────────────────────
  api:
    container_name: forkex-api
    image: forkex-api:v10
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=10010
      - WS_ENABLED=false
      - WS_URL=ws://websocket:10011/stream
      - NETWORK_URL=https://forkex.life
    extra_hosts:
      - host.docker.internal:host-gateway
    command: node app.js
    ports:
      - 10010:10010
    networks:
      - forkex-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  plugins:
    container_name: forkex-plugins
    build:
      context: ./server
      dockerfile: tools/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    command: node plugins/index.js
    ports:
      - 10012:10012
    networks:
      - forkex-network
    depends_on:
      - api

  websocket:
    container_name: forkex-ws
    build: ./ws
    restart: unless-stopped
    env_file: .env
    ports:
      - 10011:10011
    networks:
      - forkex-network
    depends_on:
      - redis

  affiliation:
    container_name: forkex-affiliation
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    volumes:
      - ./server/affiliation-service.js:/app/aindex.js
      - ./server/node_modules:/app/node_modules
    ports:
      - 10013:10013
    networks:
      - forkex-network
    command: node aindex.js

  # ─── Frontend ──────────────────────────────────────────────
  web:
    container_name: forkex-web
    image: forkex-web:v2
    build:
      context: ./web
      dockerfile: docker/Dockerfile
    restart: always
    env_file: .env
    ports:
      - 8080:80
    networks:
      - forkex-network
    depends_on:
      - api

  # ─── Proxy ─────────────────────────────────────────────────
  nginx:
    container_name: forkex-nginx
    build: ./nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/static:/usr/share/nginx/html
      - ./nginx/letsencrypt:/etc/nginx/letsencrypt:ro
    ports:
      - "127.0.0.1:8888:80"
    networks:
      - forkex-network
    depends_on:
      - api
      - web
      - websocket

  # ─── Services ──────────────────────────────────────────────
  bot:
    container_name: forkex-bot
    build: ./bot
    restart: unless-stopped
    env_file: .env
    command: ./forkex-bot
    networks:
      - forkex-network
    depends_on:
      - api

  price-oracle:
    container_name: price-oracle
    build: ./price-oracle
    restart: unless-stopped
    env_file: .env
    command: ./price-oracle
    ports:
      - 8082:8082
    networks:
      - forkex-network
    depends_on:
      - postgres

networks:
  forkex-network:
    external: true
    name: forkex-network
