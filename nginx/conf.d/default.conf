# Основные upstream серверы

# API сервер
upstream api {
    server forkex-api:10010/v2/ max_fails=3 fail_timeout=30s;
    
    # Health check
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# WebSocket сервер
upstream websocket {
    server forkex-ws:10011 max_fails=3 fail_timeout=30s;
    
    # IP hash для sticky sessions (если нужно)
    # ip_hash;
    
    keepalive 32;
    keepalive_timeout 60s;
}

# Плагины
upstream plugins {
    server forkex-plugins:10011 max_fails=3 fail_timeout=30s;
    
    keepalive 16;
    keepalive_timeout 30s;
}

# Frontend (если используется отдельный контейнер)
 upstream web {
     server forkex-web:80 max_fails=3 fail_timeout=30s;
     keepalive 16;
 }