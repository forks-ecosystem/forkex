<!DOCTYPE html>
<html>
<head>
    <title>ForkEXchange</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .status {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .status-item {
            padding: 15px 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        a {
            color: #fff;
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s ease;
        }
        a:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ForkEXchange</h1>
        <p>Next-generation cryptocurrency trading platform</p>
        
        <div class="status">
            <div class="status-item">API: <span id="api-status">Checking...</span></div>
            <div class="status-item">WebSocket: <span id="ws-status">Checking...</span></div>
        </div>
        
        <div>
            <a href="https://forkex.life/v2" target="_blank">API Documentation</a>
            <a href="https://github.com/forkex" target="_blank">GitHub</a>
            <a href="mailto:support@forkex.life">Contact Support</a>
        </div>
    </div>
    
    <script>
        // Проверка статуса сервисов
        async function checkStatus() {
            try {
                const apiRes = await fetch('https://forkex.life/v2/health');
                document.getElementById('api-status').textContent = apiRes.ok ? '✅ Online' : '❌ Offline';
                document.getElementById('api-status').style.color = apiRes.ok ? '#4CAF50' : '#F44336';
            } catch {
                document.getElementById('api-status').textContent = '❌ Offline';
                document.getElementById('api-status').style.color = '#F44336';
            }
            
            try {
                const ws = new WebSocket('wss://forkex.life/stream');
                ws.onopen = () => {
                    document.getElementById('ws-status').textContent = '✅ Online';
                    document.getElementById('ws-status').style.color = '#4CAF50';
                    ws.close();
                };
                ws.onerror = () => {
                    document.getElementById('ws-status').textContent = '❌ Offline';
                    document.getElementById('ws-status').style.color = '#F44336';
                };
                setTimeout(() => {
                    if (ws.readyState !== WebSocket.OPEN) {
                        document.getElementById('ws-status').textContent = '❌ Offline';
                        document.getElementById('ws-status').style.color = '#F44336';
                    }
                }, 3000);
            } catch {
                document.getElementById('ws-status').textContent = '❌ Offline';
                document.getElementById('ws-status').style.color = '#F44336';
            }
        }
        
        checkStatus();
        setInterval(checkStatus, 60000); // Проверять каждую минуту
    </script>
</body>
</html>
