worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS. Upstream hostnames are re-resolved at runtime
    # (cache TTL 30s) — recreating the api/web containers no longer 502s the
    # site, and no nginx restart is needed after `docker compose up -d`.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name ${DOMAIN} www.${DOMAIN};

        # Upstream endpoints as variables: proxy_pass with a variable resolves
        # through `resolver` at request time, unlike static `upstream` blocks
        # which pin the IP once at nginx start.
        set $frontend http://forkex-web:80;
        set $api      http://forkex-api:10010;
        set $plugins  http://forkex-plugins:10012;
        set $ws       http://forkex-ws:10011;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ========== ROUTING ==========
        location /api/plugins {
          rewrite /api(/|$)(.*) /$2 break;
          proxy_pass      $plugins;
        }
        location = /v2 {
            return 301 /v2/kit;
        }
        location = /v2/ {
            proxy_pass $api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /v2/charts {
            proxy_pass $api/v2/charts?$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /charts {
            proxy_pass $api/v2/charts?$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location ~ ^/chart$ {
            proxy_pass $api/v2/chart?$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /v2/ {
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /signup {
            error_page 418 = @frontend_signup;
            recursive_error_pages on;
            if ($request_method != POST) { return 418; }
            proxy_pass $api/signup;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location @frontend_signup {
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /minicharts {
            rewrite ^/minicharts(.*)$ /v2/minicharts$1 break;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /kit {
            rewrite ^/kit(.*)$ /v2/kit$1 break;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /order {
            rewrite ^/order(.*)$ /v2/order$1 break;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /stream {
            proxy_pass $ws/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /service-worker.js {
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v2/ {
            rewrite ^/api/v2/(.*)$ /v2/$1 break;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /plugins {
            rewrite /api(/|$)(.*) /$2 break;
            proxy_pass $plugins;
        }

        # ВСЕ остальное - фронтенд
        location / {
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA поддержка
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
