worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    upstream frontend { server forkex-web:80; }
    upstream api { server forkex-api:10010; }
    upstream plugins { server forkex-plugins:10012; }
    upstream ws { server forkex-ws:10011; }
    
    server {
        listen 80;
        server_name ${DOMAIN} www.${DOMAIN};

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ========== ROUTING ==========
        location /api/plugins {
          proxy_pass      http://plugins;
          rewrite /api(/|$)(.*) /$2 break;
        }
        location = /v2 {
            return 301 /v2/kit;
        }
        location = /v2/ {
            proxy_pass http://api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /v2/charts {
            proxy_pass http://api/v2/charts?$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /charts {
            proxy_pass http://api/v2/charts?$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location ~ ^/chart$ {
            proxy_pass http://api/v2/chart?$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
        }
        location /v2/ {
            proxy_pass http://api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-cache, no-store";
            rewrite /api(/|$)(.*) /$2 break;
        }
        location /signup {
            error_page 418 = @frontend_signup;
            recursive_error_pages on;
            if ($request_method != POST) { return 418; }
            proxy_pass http://api/signup;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location @frontend_signup {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /minicharts {
            proxy_pass http://api/v2/minicharts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /kit {
            proxy_pass http://api/v2/kit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /order {
            proxy_pass http://api/v2/order;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /stream {
            proxy_pass http://ws/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location /api/v2/ {
            rewrite ^/api/v2/(.*)$ /v2/$1 break;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/json; charset=utf-8" always;
        }
        location /plugins {
            proxy_pass http://plugins;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            rewrite /api(/|$)(.*) /$2 break;
        }

        # ВСЕ остальное - фронтенд
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SPA поддержка
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
