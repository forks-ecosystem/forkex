worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server forkex-web:80;
    }
    
    upstream api {
        server forkex-api:10010;
    }
    
    upstream plugins {
        server forkex-plugins:10011;
    }
    
    upstream ws {
        server forkex-ws:10080;
    }

    server {
        listen 443 ssl http2;
        server_name forkex.life www.forkex.life;
        
        ssl_certificate /etc/nginx/letsencrypt/forkex.life/fullchain.pem;
        ssl_certificate_key /etc/nginx/letsencrypt/forkex.life/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Security
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Frontend
        location / {
            proxy_pass http://forkex-web:80/;
            #root /usr/share/nginx/html;
            #index index.html;
            #try_files $uri $uri/ /index.html;
        }
        # 1. Статика - ПЕРВЫЙ И САМЫЙ ВАЖНЫЙ БЛОК
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # 2. API
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache";
        }
        
        location /v2/ {
            proxy_pass http://api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache";
        }
        
        # 3. WebSocket
        location /stream {
            proxy_pass http://ws/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        
        # 4. Плагины
        location /plugins/ {
            proxy_pass http://plugins/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache";
        }
        
        # 5. ВСЕ ОСТАЛЬНОЕ - фронтенд
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
